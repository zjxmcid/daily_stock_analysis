name: 智谱连通性测试
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 测试智谱 API
        env:
          ZHIPU_KEY: ${{ secrets.LLM_ZHIPU_API_KEY }}
        run: |
          echo "=== 直接调用智谱端点 ==="
          curl -s --max-time 30 https://open.bigmodel.cn/api/paas/v4/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $ZHIPU_KEY" \
            -d '{"model":"glm-4.7-flash","messages":[{"role":"user","content":"只回复OK两个字母"}],"max_tokens":10}'
          echo ""
          echo "=== 测试 LiteLLM 走 openai 协议 + 自定义 base_url ==="
          pip install -q litellm 2>&1 | tail -2
          python -c "
import litellm, os
r = litellm.completion(
  model='openai/glm-4.7-flash',
  api_base='https://open.bigmodel.cn/api/paas/v4',
  api_key=os.environ['ZHIPU_KEY'],
  messages=[{'role':'user','content':'只回复OK两个字母'}],
  max_tokens=10)
print('LITELLM-RESULT:', r.choices[0].message.content)
"
